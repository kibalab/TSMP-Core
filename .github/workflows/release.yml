name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    uses: kibalab/vpm-package-template/.github/workflows/vpm-release.yml@main
    with:
      package_name: com.kibalab.tsmp.core
      vpm_backend_url: https://vpm.kiba.red
    secrets:
      VPM_API_KEY: ${{ secrets.VPM_API_KEY }}

  release-notes:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the tagged release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          notes=".github/releases/$TAG.md"
          test -s "$notes"
          title=$(sed -n '1s/^# //p' "$notes")
          test -n "$title"
          gh release edit "$TAG" --repo "$REPO" --title "$title" --notes-file "$notes"
