name: Deploy website and packages

on:
  push:
    branches:
      - main
    paths:
      - 'Website~/**'
      - 'Packages/com.kibalab.tsmp.core/**'
      - '.github/scripts/pack-packages.mjs'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website and packages
    runs-on: ubuntu-latest
    env:
      DOCUSAURUS_URL: https://${{ github.repository_owner }}.github.io
      DOCUSAURUS_BASE_URL: /${{ github.event.repository.name }}/
      DOCUSAURUS_REPOSITORY_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website~/package-lock.json

      - name: Install dependencies
        working-directory: Website~
        run: npm ci

      - name: Type check
        working-directory: Website~
        run: npm run typecheck

      - name: Build
        working-directory: Website~
        run: npm run build

      - name: Build package artifacts
        run: node .github/scripts/pack-packages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Website~/build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
